<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c6fbb"/>
    </marker>
  </defs>
  <rect width="960" height="510" fill="#ffffff"/>

  <!-- ===== power chain ===== -->
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222">Power</text>

  <rect x="20" y="45" width="175" height="78" rx="8" fill="#fdf2d0" stroke="#b8860b"/>
  <text x="107" y="68" text-anchor="middle" font-weight="bold" fill="#222">Li-Po 1S 2000 mAh</text>
  <text x="107" y="87" text-anchor="middle" fill="#444">103450 (34×50×10 mm)</text>
  <text x="107" y="106" text-anchor="middle" fill="#444">3.7 V (4.2 V full)</text>

  <rect x="255" y="45" width="190" height="78" rx="8" fill="#e8f1fb" stroke="#2c6fbb"/>
  <text x="350" y="68" text-anchor="middle" font-weight="bold" fill="#222">Charger + boost</text>
  <text x="350" y="87" text-anchor="middle" fill="#444">Type-C charging</text>
  <text x="350" y="106" text-anchor="middle" fill="#444">out 9 V</text>

  <rect x="505" y="45" width="175" height="78" rx="8" fill="#e8f1fb" stroke="#2c6fbb"/>
  <text x="592" y="68" text-anchor="middle" font-weight="bold" fill="#222">CA-1235 step-down</text>
  <text x="592" y="87" text-anchor="middle" fill="#444">MP1495, in 5–16 V</text>
  <text x="592" y="106" text-anchor="middle" fill="#444">out 5 V, up to 3 A</text>

  <rect x="740" y="45" width="200" height="78" rx="8" fill="#e6f4e6" stroke="#2e8b57"/>
  <text x="840" y="68" text-anchor="middle" font-weight="bold" fill="#222">Raspberry Pi Zero 2 W</text>
  <text x="840" y="87" text-anchor="middle" fill="#444">5 V / GND</text>
  <text x="840" y="106" text-anchor="middle" fill="#444">(~0.3–0.6 A in use)</text>

  <line x1="195" y1="84" x2="253" y2="84" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="224" y="77" text-anchor="middle" font-size="11" fill="#c0392b">B+ / B−</text>
  <line x1="445" y1="84" x2="503" y2="84" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="474" y="77" text-anchor="middle" font-size="11" fill="#c0392b">9 V</text>
  <line x1="680" y1="84" x2="738" y2="84" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="709" y="77" text-anchor="middle" font-size="11" fill="#c0392b">5 V</text>
  <text x="350" y="142" text-anchor="middle" font-size="11" fill="#2c6fbb">USB-C: charge the battery</text>

  <!-- ===== board stack (side view) ===== -->
  <text x="20" y="190" font-size="16" font-weight="bold" fill="#222">Board stack (side view)</text>

  <rect x="40" y="215" width="380" height="58" rx="6" fill="#1f4e8c"/>
  <text x="230" y="240" text-anchor="middle" fill="#fff" font-weight="bold">Waveshare 1.44" LCD HAT</text>
  <text x="230" y="259" text-anchor="middle" fill="#dfe8f5" font-size="12">ST7735S 128×128 · joystick · KEY1-3</text>
  <rect x="120" y="273" width="220" height="16" fill="#333"/>
  <text x="230" y="285" text-anchor="middle" fill="#ddd" font-size="11">40-pin GPIO header</text>

  <rect x="40" y="289" width="380" height="44" rx="6" fill="#2e8b57"/>
  <text x="230" y="316" text-anchor="middle" fill="#fff" font-weight="bold">Raspberry Pi Zero 2 W</text>

  <g fill="#c9a227">
    <rect x="96" y="333" width="5" height="16"/><rect x="108" y="333" width="5" height="16"/>
    <rect x="120" y="333" width="5" height="16"/><rect x="132" y="333" width="5" height="16"/>
  </g>
  <text x="150" y="346" fill="#8a6d00" font-size="11">pogo pins → USB test pads</text>

  <rect x="40" y="349" width="380" height="50" rx="6" fill="#16365f"/>
  <text x="230" y="371" text-anchor="middle" fill="#fff" font-weight="bold">Waveshare USB HUB HAT (B)</text>
  <text x="230" y="389" text-anchor="middle" fill="#dfe8f5" font-size="12">4× USB-A · USB-UART</text>

  <rect x="440" y="355" width="160" height="38" rx="6" fill="#f2f2f2" stroke="#888"/>
  <text x="520" y="379" text-anchor="middle" fill="#222">mini keyboard (USB)</text>
  <line x1="438" y1="374" x2="422" y2="374" stroke="#2c6fbb" stroke-width="2" marker-end="url(#arrowg)"/>

  <text x="40" y="430" fill="#444" font-size="12">The LCD HAT plugs onto the GPIO header; the USB hub sits under the</text>
  <text x="40" y="447" fill="#444" font-size="12">Zero and reaches its USB through spring (pogo) pins, so both fit together.</text>
  <text x="40" y="472" fill="#444" font-size="12">Display: kernel panel-mipi-dbi driver → /dev/fb0</text>
  <text x="40" y="489" fill="#444" font-size="12">Buttons: gpio-key overlay → normal keyboard events</text>

  <!-- ===== LCD HAT pin table ===== -->
  <text x="640" y="190" font-size="16" font-weight="bold" fill="#222">LCD HAT pins (BCM GPIO)</text>
  <g font-size="12">
    <rect x="640" y="205" width="300" height="24" fill="#1f4e8c"/>
    <text x="652" y="222" fill="#fff" font-weight="bold">Signal</text>
    <text x="790" y="222" fill="#fff" font-weight="bold">GPIO</text>
    <text x="876" y="222" fill="#fff" font-weight="bold">As key</text>
  </g>
  <g font-size="12" fill="#222">
    <rect x="640" y="229" width="300" height="22" fill="#f4f7fb"/>
    <text x="652" y="244">SPI MOSI / SCLK</text><text x="790" y="244">10 / 11</text><text x="876" y="244">—</text>
    <text x="652" y="266">SPI CS (CE0)</text><text x="790" y="266">8</text><text x="876" y="266">—</text>
    <rect x="640" y="273" width="300" height="22" fill="#f4f7fb"/>
    <text x="652" y="288">LCD DC / RST / BL</text><text x="790" y="288">25 / 27 / 24</text><text x="876" y="288">—</text>
    <text x="652" y="310">Joystick UP</text><text x="790" y="310">6</text><text x="876" y="310">Up</text>
    <rect x="640" y="317" width="300" height="22" fill="#f4f7fb"/>
    <text x="652" y="332">Joystick DOWN</text><text x="790" y="332">19</text><text x="876" y="332">Down</text>
    <text x="652" y="354">Joystick LEFT</text><text x="790" y="354">5</text><text x="876" y="354">Left</text>
    <rect x="640" y="361" width="300" height="22" fill="#f4f7fb"/>
    <text x="652" y="376">Joystick RIGHT</text><text x="790" y="376">26</text><text x="876" y="376">Right</text>
    <text x="652" y="398">Joystick PRESS</text><text x="790" y="398">13</text><text x="876" y="398">Enter</text>
    <rect x="640" y="405" width="300" height="22" fill="#f4f7fb"/>
    <text x="652" y="420">KEY1</text><text x="790" y="420">21</text><text x="876" y="420">1</text>
    <text x="652" y="442">KEY2</text><text x="790" y="442">20</text><text x="876" y="442">2</text>
    <rect x="640" y="449" width="300" height="22" fill="#f4f7fb"/>
    <text x="652" y="464">KEY3</text><text x="790" y="464">16</text><text x="876" y="464">3</text>
  </g>
  <rect x="640" y="205" width="300" height="266" fill="none" stroke="#1f4e8c"/>
  <text x="640" y="492" fill="#444" font-size="12">Buttons are active-low with internal pull-ups.</text>
</svg>
