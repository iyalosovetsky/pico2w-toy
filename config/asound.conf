# /etc/asound.conf - PicoCalc: play everything on the PWM audio output
# (GPIO 12/13 via dtoverlay=audremap, the "bcm2835 Headphones" card).
# Plain hw access, not dmix: dmix on this card hangs when a program closes it.
# One program at a time, so the menu releases the sound while a game runs.
pcm.!default {
    type plug
    slave.pcm "hw:Headphones"
}
ctl.!default {
    type hw
    card Headphones
}
